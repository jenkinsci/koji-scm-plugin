name: Java CI with Maven

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-linux:
    name: "ubuntu latest all jdks"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        jdkconf:
          - JDK 21
          - JDK Latest
        include:
          - jdkconf: JDK 21
            jdkver: "21"
          - jdkconf: JDK Latest
            jdkver: "25"

    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Set up JDK
        uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.jdkver}}

      - name: Cache Maven repository
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Build with Maven
        run: |
          export MAVEN_OPTS="-Xmx4G"
          mvn install -DskipTests

      - name: test koji-scm-lib
        run: |
          export MAVEN_OPTS="-Xmx4G"
          cd koji-scm-lib
          mvn test

      - name: test fake-koji
        run: |
          export MAVEN_OPTS="-Xmx4G"
          cd fake-koji
          mvn test -Dheadless=true #the webapp takes long and was created in original full build and we do not clean

      - name: test jenkins-scm-koji-plugin
        run: |
          export MAVEN_OPTS="-Xmx4G"
          cd koji-scm
          mvn test

      - name: Store artifacts
        run: |
          mkdir archives
          cp fake-koji/target/fake-koji-jar-with-dependencies.jar archives/
          cp koji-scm/target/koji-scm.hpi archives/
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifact-${{ matrix.jdkver }}-linux
          path: archives
